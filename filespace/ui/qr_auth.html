<!doctype html>
<html lang="en">

<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width,initial-scale=1">
   <meta name="color-scheme" content="dark">
   <title>FileSpace · QR login</title>
   <style>
      :root {
         --bg: #0a1020;
         --line: #26334b;
         --text: #edf2ff;
         --muted: #9ba9c2;
         --accent: #9ba9ff
      }

      * {
         box-sizing: border-box
      }

      body {
         margin: 0;
         min-height: 100vh;
         display: grid;
         place-items: center;
         padding: 20px;
         background: radial-gradient(ellipse at 10% 0%, #202b55 0, transparent 35%), radial-gradient(ellipse at 95% 10%, #10334b 0, transparent 28%), var(--bg);
         color: var(--text);
         font: 14px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif
      }

      .card {
         width: min(420px, 100%);
         border: 1px solid var(--line);
         border-radius: 22px;
         background: rgba(17, 26, 45, .94);
         padding: 30px;
         box-shadow: 0 22px 65px #0004
      }

      .brand {
         display: flex;
         align-items: center;
         gap: 11px;
         font-size: 19px;
         font-weight: 800;
         letter-spacing: -.04em;
         margin-bottom: 22px
      }

      .logo {
         width: 42px;
         height: 42px;
         border-radius: 14px;
         display: grid;
         place-items: center;
         background: linear-gradient(135deg, #a5b4fc, #67e8f9);
         color: #0a1020;
         font-size: 22px
      }

      h1 {
         font-size: 26px;
         letter-spacing: -.04em;
         margin: 0 0 6px
      }

      p {
         color: var(--muted);
         margin: 0
      }

      .err {
         min-height: 20px;
         margin-top: 14px;
         color: #fca5a5;
         font-size: 12px
      }

      a {
         display: inline-block;
         margin-top: 18px;
         color: var(--accent);
         font-weight: 700;
         text-decoration: none
      }
   </style>
</head>

<body>
   <main class="card">
      <div class="brand"><span class="logo">▱</span>FileSpace</div>
      <h1>QR login</h1>
      <p id="msg">Checking the one-time code...</p>
      <div class="err" id="err" role="alert"></div><a href="/">Back to sign in</a>
   </main>
   <script>
      const msg = document.getElementById('msg'), err = document.getElementById('err');
      function tokenFromHash() { const raw = location.hash.replace(/^#/, ''); if (!raw) return ''; const q = raw[0] === '?' ? raw.slice(1) : raw; const p = new URLSearchParams(q); return p.get('t') || p.get('token') || (!q.includes('=') ? q : '') }
      const token = tokenFromHash(); history.replaceState(null, '', location.pathname);
      async function run() {
         if (!token) { msg.textContent = 'No QR token was found in this link.'; return }
         try {
            const r = await fetch('/auth/qr/consume', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token }) });
            const d = await r.json().catch(() => ({})); if (r.ok) { msg.textContent = 'Signed in. Opening FileSpace...'; location.replace('/'); return }
            msg.textContent = 'QR login failed.'; err.textContent = d.error || ('Request failed (' + r.status + ')')
         }
         catch { msg.textContent = 'QR login failed.'; err.textContent = 'Could not reach the server.' }
      }
      run();
   </script>
</body>

</html>
